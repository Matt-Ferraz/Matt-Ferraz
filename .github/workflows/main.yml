name: Generate profile assets

on:
  schedule: # once every 12 hours, on the hour
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (light + dark)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#38BDF8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
